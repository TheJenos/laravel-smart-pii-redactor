name: Release

on:
  push:
    branches:
      - main
  # Re-run a release for the current composer.json version, e.g. after a failed run...
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version from composer.json
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' composer.json)

          if [ -z "$VERSION" ]; then
            echo "::error::composer.json has no \"version\" field"
            exit 1
          fi

          TAG="v${VERSION#v}"

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' in composer.json is not a valid semver version (expected X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Only a version bump releases; pushes that keep the same version are skipped...
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $TAG."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests & static analysis
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, bz2, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Validate composer.json
        # Not --strict: the "version" field this workflow releases from is always reported as a warning...
        run: composer validate --no-check-lock --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      # Stanford NER runs on the JVM...
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --memory-limit=1G

      - name: Execute tests
        run: vendor/bin/pest --ci

  release:
    name: Publish release
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub release
        run: |
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag $PRERELEASE

      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::warning::PACKAGIST_USERNAME / PACKAGIST_TOKEN not set; relying on the Packagist GitHub hook to pick up $TAG"
            exit 0
          fi

          curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}"

  changelog:
    name: Update changelog
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pre-releases don't go in the changelog, matching update-changelog.yml which only runs on full releases...
    if: ${{ !contains(needs.prepare.outputs.tag, '-') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      # Releases created with GITHUB_TOKEN don't trigger update-changelog.yml, so the notes are written here...
      - name: Fetch release notes
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            gh release view "${{ needs.prepare.outputs.tag }}" --json body --jq .body
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ needs.prepare.outputs.tag }}
          release-notes: ${{ steps.notes.outputs.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md

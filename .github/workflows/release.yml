name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 (a "v" prefix is added)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a valid semver tag (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Tests & static analysis
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      # Mitie's own post-install hook only runs when it's the root package, so the native library is fetched here...
      - name: Install MITIE native library
        run: php -r "require 'vendor/autoload.php'; Mitie\Vendor::check();"

      - name: Cache NER model
        uses: actions/cache@v4
        with:
          path: src/Models/ner_model.dat
          key: mitie-ner-model-v0.2

      - name: Download NER model
        run: vendor/bin/testbench smart-pii-redactor:init

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --memory-limit=1G

      - name: Execute tests
        run: vendor/bin/pest --ci

  release:
    name: Publish release
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        run: |
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag $PRERELEASE

      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::warning::PACKAGIST_USERNAME / PACKAGIST_TOKEN not set; relying on the Packagist GitHub hook to pick up $TAG"
            exit 0
          fi

          curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}"

  changelog:
    name: Update changelog
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pre-releases don't go in the changelog, matching update-changelog.yml which only runs on full releases...
    if: ${{ !contains(needs.prepare.outputs.tag, '-') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      # Releases created with GITHUB_TOKEN don't trigger update-changelog.yml, so the notes are written here...
      - name: Fetch release notes
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            gh release view "${{ needs.prepare.outputs.tag }}" --json body --jq .body
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ needs.prepare.outputs.tag }}
          release-notes: ${{ steps.notes.outputs.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
